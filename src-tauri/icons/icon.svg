<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Monitor Chassis (Dim Green) -->
  <rect x="60" y="80" width="392" height="280" rx="20" fill="none" stroke="#2d4a00" stroke-width="24" />
  <rect x="200" y="360" width="112" height="24" rx="4" fill="#2d4a00" />
  <rect x="150" y="384" width="212" height="12" rx="4" fill="#2d4a00" />

  <!-- Inner Screen Brackets (Neon Green) -->
  <g filter="url(#neon-glow)">
    <path d="M110 160 L110 130 L140 130" fill="none" stroke="#76b900" stroke-width="12" stroke-linecap="round" />
    <path d="M372 130 L402 130 L402 160" fill="none" stroke="#76b900" stroke-width="12" stroke-linecap="round" />
    <path d="M402 280 L402 310 L372 310" fill="none" stroke="#76b900" stroke-width="12" stroke-linecap="round" />
    <path d="M140 310 L110 310 L110 280" fill="none" stroke="#76b900" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- "CS" Monogram (Neon Green / White) -->
  <text x="256" y="220" font-family="monospace" font-size="140" fill="#76b900" text-anchor="middle" dominant-baseline="central" font-weight="900" filter="url(#neon-glow)" style="letter-spacing: -10px;">CS</text>
  
  <!-- Subtle Scanline Effect -->
  <path d="M84 220 L428 220" stroke="#76b900" stroke-width="2" opacity="0.1" />
</svg>
