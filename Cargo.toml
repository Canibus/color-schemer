[package]
name = "color-schemer"
version = "0.1.0"
edition = "2024"

[dependencies]
# NVAPI bindings
nvapi = "0.1"
# Или используем raw FFI к nvapi64.dll
libloading = "0.8"

# Горячие клавиши (tray app only)
global-hotkey = { version = "0.6", optional = true }

# Системный трей (tray app only)
tray-icon = { version = "0.19", optional = true }

# Конфигурация
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Логирование
log = "0.4"
env_logger = "0.11"

crossbeam-channel = "0.5"
thiserror = "2.0.18"

# Windows-only dependencies
[target.'cfg(windows)'.dependencies]
winrt-notification = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[build-dependencies]
cc = "1"

[features]
default = ["app"]
# Enables the original tray + hotkey Windows utility (binary).
app = ["hotkeys", "tray", "notifications"]
hotkeys = ["dep:global-hotkey"]
tray = ["dep:tray-icon"]
notifications = ["dep:winrt-notification"]
