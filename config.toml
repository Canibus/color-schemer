show_notifications = false
start_minimized = false

[hotkeys]
next_profile = "Ctrl+Shift+E"
prev_profile = "Ctrl+Shift+Q"
reset = "Ctrl+Shift+W"

[[profiles]]
name = "Default"
description = "Standard settings"

[profiles.settings]
brightness = 1.0
contrast = 1.0
gamma = 1.0
digital_vibrance = 0

[[profiles]]
name = "Gaming"
description = "Gaming profile - increased brightness and vibrance"

[profiles.settings]
brightness = 1.1
contrast = 1.15
gamma = 0.95
digital_vibrance = 63

[[profiles]]
name = "Movie"
description = "Movie watching mode"

[profiles.settings]
brightness = 0.95
contrast = 1.1
gamma = 1.1
digital_vibrance = 20

[[profiles]]
name = "Night"
description = "Night mode - reduced brightness"

[profiles.settings]
brightness = 0.7
contrast = 0.9
gamma = 1.2
digital_vibrance = 0

[[profiles]]
name = "Vibrant"
description = "Maximum color saturation"

[profiles.settings]
brightness = 1.0
contrast = 1.2
gamma = 0.9
digital_vibrance = 100
